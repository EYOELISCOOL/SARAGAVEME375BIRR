function BlForm({init,onSave,onClose}){const e=!!init;const[f,setF]=useState(init||{fullName:'',phone:'',orderId:'',ticketType:'',receiptUrl:'',administrativeStatus:'Rejected by admin',rejectionReason:'',reviewStatus:'Pending review',notes:''});const[er,setEr]=useState({});const[sv,setSv]=useState(false);const s=(k,v)=>setF(p=>({...p,[k]:v}));
 const sub=ev=>{ev.preventDefault();if(sv)return;const x={};if(!f.fullName.trim())x.fullName='Required';if(!f.rejectionReason.trim())x.rejectionReason='Required';if(f.receiptUrl&&!/^https?:\/\//.test(f.receiptUrl.trim()))x.receiptUrl='Must start with http(s)://';setEr(x);if(Object.keys(x).length)return;setSv(true);onSave(f)};
 return <form onSubmit={sub}><Field label="Name" err={er.fullName}><input className={inp} value={f.fullName} onChange={x=>s('fullName',x.target.value)}/></Field>

 <div className="grid grid-cols-2 gap-3"><Field label="Ticket type"><input className={inp} value={f.ticketType} onChange={x=>s('ticketType',x.target.value)}/></Field><Field label="Administrative status"><input className={inp} value={f.administrativeStatus} onChange={x=>s('administrativeStatus',x.target.value)}/></Field></div>
 <Field label="Recorded rejection reason" err={er.rejectionReason}><input className={inp} value={f.rejectionReason} onChange={x=>s('rejectionReason',x.target.value)}/></Field>
 <Field label="Receipt URL" err={er.receiptUrl}><input className={inp} value={f.receiptUrl} onChange={x=>s('receiptUrl',x.target.value)}/></Field>
 <Field label="Internal notes"><textarea className={inp} rows="2" value={f.notes} onChange={x=>s('notes',x.target.value)}/></Field>
 <div className="flex justify-end gap-2"><button type="button" className={btn} onClick={onClose}>Cancel</button><button className={btnP} disabled={sv}>{e?'Save changes':'Add record'}</button></div></form>}

function App(){
 const boot=useMemo(load,[]);const[data,setData]=useState(boot.data);const[auth,setAuth]=useState(()=>{try{return sessionStorage.getItem('vvx_auth')==='1'}catch(e){return false}});
 const[page,setPage]=useState('overview');const[nav,setNav]=useState(false);const[toast,setToast]=useState(null);const[conf,setConf]=useState(null);const[modal,setModal]=useState(null);const[selOrder,setSelOrder]=useState(null);
 const[q,setQ]=useState('');const[fT,setFT]=useState('');const[fP,setFP]=useState('');const[fC,setFC]=useState('');const[sk,setSk]=useState('fullName');const[sd,setSd]=useState(1);const[lim,setLim]=useState(25);
 const[bq,setBq]=useState('');const[bR,setBR]=useState('');const[bS,setBS]=useState('');
 const[oq,setOq]=useState('');
 useEffect(()=>{if(data)try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}},[data]);
 useEffect(()=>{setLim(25)},[q,fT,fP,fC,page]);
 const note=(m,err)=>{setToast({m,err});setTimeout(()=>setToast(null),3200)};
 const upd=fn=>setData(d=>fn(d));
 if(boot.error!==undefined)return <main className="min-h-screen flex items-center justify-center p-6"><div className="max-w-md border border-red-900 p-6 bg-[#120808]"><h1 className="font-black text-xl uppercase">Saved data unreadable</h1><p className="text-sm text-[#bbb] my-3">Stored data is malformed. Nothing has been overwritten. Download the raw data first, then choose whether to reset.</p><div className="flex gap-2"><button className={btn} onClick={()=>{const u=URL.createObjectURL(new Blob([boot.error]));const a=document.createElement('a');a.href=u;a.download='vovex-raw-backup.txt';a.click()}}>Download raw</button><button className={btnD} onClick={()=>{if(confirm('Replace stored data with the original dataset?')){localStorage.removeItem(K);location.reload()}}}>Reset to original</button></div></div></main>;
 const st=data.settings,cur=st.currency||'ETB',cats=st.categories;
 if(!auth)return <Login creds={getCreds(st)} onOk={()=>{try{sessionStorage.setItem('vvx_auth','1')}catch(e){}setAuth(true)}}/>;
 const A=data.attendees,O=data.orders,R=data.receipts,B=data.blacklist;
 const paidA=A.filter(a=>a.paymentStatus==='Paid');
 const recon=o=>{const l=A.filter(a=>a.orderId===o.orderId),rc=R.filter(r=>r.orderId===o.orderId),sa=l.reduce((s,a)=>s+Number(a.allocatedAmount),0),sr=rc.reduce((s,r)=>s+Number(r.amount),0),is=[];
  if(!l.length)is.push('No linked attendees');else if(sa!==Number(o.orderTotal))is.push('Attendee allocations ('+sa+') ≠ order total ('+o.orderTotal+')');
  if(rc.length&&sr!==Number(o.orderTotal))is.push('Receipt amount ('+sr+') ≠ order total ('+o.orderTotal+')');
  rc.forEach(r=>{const p=dec(r.url);if(p&&p.t!==Number(r.amount))is.push('Receipt payload amount ('+p.t+') ≠ stored amount ('+r.amount+')');urlFlags(r.url,o.orderId).forEach(x=>is.push(x))});
  return{l,rc,sa,sr,is}};
 const rev=O.filter(o=>o.paymentStatus==='Paid').reduce((s,o)=>s+Number(o.orderTotal),0);
 const rcCount=new Set(R.map(r=>r.sourceReceiptId)).size;
 const checked=paidA.filter(a=>a.checkInStatus==='Checked In').length;
 const matches=(()=>{const m=[];A.forEach(a=>B.forEach(b=>{const w=[];const na=norm(a.fullName),nb=norm(b.fullName);if(na&&na===nb)w.push('Normalized name');else{const ta=na.split(' '),tb=nb.split(' ');if(ta.length>1&&tb.length>1&&ta.filter(t=>tb.includes(t)).length>=2)w.push('Overlapping name parts (possible)')}
  if(b.orderId&&a.orderId===b.orderId)w.push('Order ID');if(w.length)m.push({key:a.id+'|'+b.id,a,b,why:w.join(', ')})}));return m})();
 const matchOf=a=>matches.filter(m=>m.a.id===a.id);
 const unrev=matches.filter(m=>!data.reviewedMatches.includes(m.key));
 const blFlags=b=>{const f=urlFlags(b.receiptUrl,b.orderId);const p=dec(b.receiptUrl);const pt=p&&p.a&&p.a[0]&&TL[p.a[0][1]];if(pt&&b.ticketType&&pt!==b.ticketType)f.push('Ticket type note "'+b.ticketType+'" vs receipt payload "'+pt+'"');return f};
 const warns=[];O.forEach(o=>recon(o).is.forEach(i=>warns.push({t:o.orderId+': '+i,go:()=>{setPage('orders');setSelOrder(o.id)}})));B.forEach(b=>blFlags(b).forEach(i=>warns.push({t:b.fullName+': '+i,go:()=>setPage('blacklist')})));unrev.forEach(m=>warns.push({t:'REVIEW REQUIRED: '+m.a.fullName+' ↔ '+m.b.fullName+' ('+m.why+')',go:()=>setPage('blacklist')}));
 const openOrder=a=>{const o=O.find(o=>o.orderId===a.orderId);if(o){setPage('orders');setSelOrder(o.id)}else note('No order record for '+a.orderId,1)};
 const rcOf=a=>R.find(r=>r.orderId===a.orderId);
 const ask=(title,body,label,fn)=>setConf({title,body,label,fn});

 const addAtt=f=>{upd(d=>{const att={id:uid('att'),fullName:f.fullName,ticketType:f.ticketType,allocatedAmount:f.allocatedAmount,paymentStatus:f.paymentStatus,payerName:f.payerName,orderId:f.orderId,checkInStatus:'Not Checked In',checkInTimestamp:null,notes:f.notes||''};let orders=d.orders,receipts=d.receipts;
  if(!orders.find(o=>o.orderId===f.orderId)){orders=[...orders,{id:uid('ord'),orderId:f.orderId,payerName:f.payerName,orderTotal:f.allocatedAmount,paymentStatus:f.paymentStatus,createdAt:new Date().toISOString(),notes:''}];if(f.url)receipts=[...receipts,{id:uid('rcp'),sourceReceiptId:(dec(f.url)||{}).id||f.orderId,orderId:f.orderId,url:f.url,amount:f.allocatedAmount,status:'Source record',notes:''}]}
  return{...d,attendees:[...d.attendees,att],orders,receipts}});setModal(null);note('Attendee added ('+f.paymentStatus+')')};
 const editAtt=(id,f)=>{upd(d=>({...d,attendees:d.attendees.map(a=>a.id===id?{...a,fullName:f.fullName,ticketType:f.ticketType,allocatedAmount:f.allocatedAmount,paymentStatus:f.paymentStatus,payerName:f.payerName,notes:f.notes||''}:a)}));setModal(null);note('Attendee updated')};
 const delAtt=a=>{const last=A.filter(x=>x.orderId===a.orderId).length===1;ask('Delete attendee','Delete '+a.fullName+'?'+(last?' This is the only attendee on order '+a.orderId+', so the order and its receipt records will also be removed'+(O.find(o=>o.orderId===a.orderId&&o.paymentStatus==='Paid')?' and Total Revenue Made will drop accordingly.':'.'):' The order total is NOT changed automatically; check reconciliation afterwards.'),'Delete',()=>{upd(d=>({...d,attendees:d.attendees.filter(x=>x.id!==a.id),orders:last?d.orders.filter(o=>o.orderId!==a.orderId):d.orders,receipts:last?d.receipts.filter(r=>r.orderId!==a.orderId):d.receipts}));note('Attendee deleted')})};
 const toggleCI=a=>{upd(d=>({...d,attendees:d.attendees.map(x=>x.id===a.id?(x.checkInStatus==='Checked In'?{...x,checkInStatus:'Not Checked In',checkInTimestamp:null}:{...x,checkInStatus:'Checked In',checkInTimestamp:new Date().toISOString()}):x)}));note(a.checkInStatus==='Checked In'?'Check-in undone':a.fullName+' checked in')};

 const Pg=({t,sub,right})=><div className="flex flex-wrap items-end justify-between gap-3 mb-5"><div><h1 className="text-3xl sm:text-4xl font-black uppercase tracking-tight leading-none">{t}</h1>{sub&&<p className="text-sm text-[#8a8a8a] mt-2">{sub}</p>}</div><div className="flex gap-2 flex-wrap">{right}</div></div>;
 const Metric=({l,v,s,big})=><div className="border border-[#2a2a2a] bg-[#121212] p-4"><div className="text-[10px] font-bold uppercase tracking-[0.18em] text-[#8a8a8a]">{l}</div><div className={'font-black tracking-tight mt-2 '+(big?'text-3xl':'text-4xl')}>{v}</div>{s&&<div className="text-[11px] text-[#777] mt-1">{s}</div>}</div>;
 const matchBadge=a=>{const ms=matchOf(a);if(!ms.length)return a.reviewStatus==='x'?null:<Badge>Clear</Badge>;const un=ms.filter(m=>!data.reviewedMatches.includes(m.key));return un.length?<button onClick={()=>setPage('blacklist')} title={un.map(m=>m.why+' → '+m.b.fullName).join('; ')}><Badge c="warn">REVIEW REQUIRED</Badge></button>:<Badge c="ok">Reviewed</Badge>};

 /* ---------- Pages ---------- */
 const Overview=()=>{const cn=[...new Set([...cats.map(c=>c.name),...paidA.map(a=>a.ticketType)])];return <>
  <Pg t="Overview" sub={st.eventName+' · '+st.eventDate} right={<><button className={btnP} onClick={()=>setModal({k:'att'})}><I n="plus"/>Add attendee</button><button className={btn} onClick={()=>setPage('orders')}><I n="rcpt"/>Review receipts</button></>}/>
  <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-3">
   <Metric l="Paid Attendees" v={paidA.length}/><Metric l="Tickets Sold" v={paidA.length} s="Individual paid allocations"/>
   <div className="col-span-2 lg:col-span-1"><Metric l="TOTAL REVENUE MADE" v={money(rev,cur)} big s="Distinct paid orders, counted once"/></div>
   <Metric l="Orders & Receipts" v={O.length} s={rcCount+' distinct receipt IDs'}/><Metric l="Rejected Submissions" v={B.length} s="Excluded from sales"/></div>
  <div className="grid lg:grid-cols-3 gap-3">
   <Panel title="Check-in progress"><div className="text-3xl font-black">{checked}<span className="text-[#666]"> / {paidA.length}</span></div><div className="h-2 bg-[#222] mt-3"><div className="h-2 bg-[#e8e2d0]" style={{width:(paidA.length?checked/paidA.length*100:0)+'%'}}/></div><div className="text-xs text-[#888] mt-2">{paidA.length-checked} remaining</div></Panel>
   <Panel title="Ticket category breakdown"><table className="w-full text-sm"><tbody>{cn.map(n=>{const l=paidA.filter(a=>a.ticketType===n);return <tr key={n}><td className="py-1">{n}</td><td className="text-right mono">{l.length}</td><td className="text-right mono text-[#999]">{money(l.reduce((s,a)=>s+Number(a.allocatedAmount),0),cur)}</td></tr>})}</tbody></table></Panel>
   <Panel title={'Data quality ('+warns.length+')'}>{warns.length?<ul className="space-y-2 max-h-44 overflow-y-auto">{warns.map((w,i)=><li key={i}><button onClick={w.go} className="text-left text-xs text-amber-300 hover:underline flex gap-1.5"><span className="mt-0.5"><I n="alert" s={12}/></span>{w.t}</button></li>)}</ul>:<Badge c="ok">No warnings</Badge>}</Panel>
   <Panel title="Recent paid attendees" cls="lg:col-span-1">{paidA.slice(-5).reverse().map(a=><div key={a.id} className="flex justify-between py-1.5 border-b border-[#1f1f1f] text-sm"><span>{a.fullName}</span><span className="mono text-[#999]">{a.allocatedAmount}</span></div>)}</Panel>
   <Panel title="Recent orders">{O.slice(-5).reverse().map(o=><button key={o.id} onClick={()=>{setPage('orders');setSelOrder(o.id)}} className="w-full flex justify-between py-1.5 border-b border-[#1f1f1f] text-sm hover:text-white text-left"><span className="mono text-xs">{o.orderId}</span><span className="mono text-[#999]">{money(o.orderTotal,cur)}</span></button>)}</Panel>
   <Panel title="Recent rejected submissions">{B.slice(-5).reverse().map(b=><div key={b.id} className="flex justify-between gap-2 py-1.5 border-b border-[#1f1f1f] text-sm"><span>{b.fullName}</span><Badge c="red">Rejected</Badge></div>)}</Panel>
  </div></>};

 const Attendees=()=>{const nq=norm(q);let rows=A.filter(a=>(!nq||norm(a.fullName).includes(nq)||norm(a.payerName).includes(nq)||norm(a.orderId).includes(nq))&&(!fT||a.ticketType===fT)&&(!fP||a.paymentStatus===fP)&&(!fC||a.checkInStatus===fC));
  rows=[...rows].sort((a,b)=>String(a[sk]).localeCompare(String(b[sk]),undefined,{sensitivity:'base'})*sd);

  <div className="grid grid-cols-2 lg:grid-cols-6 gap-2 mb-3"><div className="col-span-2 relative"><span className="absolute left-2.5 top-2.5 text-[#666]"><I n="search"/></span><input aria-label="Search" className={inp+' pl-8'} placeholder="Search name, payer, order ID" value={q} onChange={e=>setQ(e.target.value)}/></div>
   <select aria-label="Ticket category" className={inp} value={fT} onChange={e=>setFT(e.target.value)}><option value="">All categories</option>{cats.map(c=><option key={c.name}>{c.name}</option>)}</select>
   <select aria-label="Payment status" className={inp} value={fP} onChange={e=>setFP(e.target.value)}><option value="">All payments</option>{['Paid','Pending','Cancelled'].map(c=><option key={c}>{c}</option>)}</select>

  {nq&&B.filter(b=>b.entryDenied&&(norm(b.fullName).includes(nq)||nq.includes(norm(b.fullName)))).map(b=><div key={b.id} role="alert" className="mb-3 border border-red-800 bg-red-950/50 text-red-300 px-4 py-3 text-sm font-bold uppercase tracking-wider">⛔ DENIED ENTRY — {b.fullName} is on the blacklist ({b.rejectionReason})</div>)}
  <div className="border border-[#2a2a2a] bg-[#101010] overflow-x-auto">{rows.length?<table className="w-full min-w-[1100px]"><thead><tr>{['Attendee','Type','Value','Payment','Payer','Order ID','Receipt','Check-in','Review','Actions'].map(h=><th key={h} className={th}>{h}</th>)}</tr></thead><tbody>{rows.slice(0,lim).map(a=><tr key={a.id} className="hover:bg-[#161616]">
   <td className={td+' font-semibold'}>{a.fullName}</td><td className={td}>{a.ticketType}</td><td className={td+' mono'}>{a.allocatedAmount}</td><td className={td}><Badge c={a.paymentStatus==='Paid'?'ok':'gray'}>{a.paymentStatus}</Badge></td><td className={td}>{a.payerName}</td>
   <td className={td}><button className="mono text-xs underline underline-offset-2 hover:text-white" onClick={()=>openOrder(a)}>{a.orderId}</button></td><td className={td}><Ext url={(rcOf(a)||{}).url}/></td>
   <td className={td}>{a.checkInStatus==='Checked In'?<><Badge c="ok">Checked in</Badge><div className="text-[10px] text-[#777] mt-1">{new Date(a.checkInTimestamp).toLocaleString()}</div></>:<Badge>Not checked in</Badge>}</td><td className={td}>{matchBadge(a)}</td>
   <td className={td}><div className="flex gap-1">{a.checkInStatus==='Checked In'?<button className={btn} onClick={()=>toggleCI(a)}><I n="undo" s={13}/>Undo</button>:<button className={btnP} onClick={()=>toggleCI(a)}><I n="check" s={13}/>Check in</button>}<button className={btn} aria-label={'Edit '+a.fullName} onClick={()=>setModal({k:'att',a})}><I n="edit" s={13}/></button><button className={btnD} aria-label={'Delete '+a.fullName} onClick={()=>delAtt(a)}><I n="trash" s={13}/></button></div></td></tr>)}</tbody></table>:<Empty t="No attendees match these filters"/>}<Limit n={lim} total={rows.length} more={()=>setLim(lim+25)}/></div></>};

 const Orders=()=>{const nq=norm(oq);const rows=O.filter(o=>!nq||norm(o.orderId).includes(nq)||norm(o.payerName).includes(nq));return <>
  <Pg t="Orders & Receipts" sub={O.length+' orders · '+rcCount+' distinct receipt IDs · Total Revenue Made '+money(rev,cur)} right={<button className={btn} onClick={()=>{dl('vovex-orders.csv',['Order ID','Payer','Linked attendees','Ticket count','Receipt amount','Payment status','Receipt URL','Reconciliation status'],O.map(o=>{const r=recon(o);return[o.orderId,o.payerName,r.l.map(a=>a.fullName).join('; '),r.l.length,o.orderTotal,o.paymentStatus,r.rc.map(x=>x.url).join(' | '),r.is.length?'WARNING: '+r.is.join('; '):'Reconciled']}));note('Orders exported')}}><I n="down"/>CSV</button>}/>

 const OrderDrawer=()=>{const o=O.find(x=>x.id===selOrder);const[f,setF]=useState(o?{orderTotal:o.orderTotal,paymentStatus:o.paymentStatus,notes:o.notes||'',payerName:o.payerName}:{});if(!o)return null;const r=recon(o);

   <h4 className="text-[10px] font-bold uppercase tracking-[0.18em] text-[#8a8a8a] mb-1">Linked attendees ({r.l.length}) · allocations {money(r.sa,cur)}</h4>
   <ul className="mb-3 text-sm border border-[#2a2a2a]">{r.l.map(a=><li key={a.id} className="flex justify-between px-3 py-1.5 border-b border-[#1f1f1f]"><span>{a.fullName} <span className="text-[#777] text-xs">· {a.ticketType}</span></span><span className="mono">{a.allocatedAmount}</span></li>)}{!r.l.length&&<li className="px-3 py-2 text-[#777]">None</li>}</ul>
   {sharedPayer.length>0&&<p className="text-xs text-[#aaa] mb-3">Shared payer with: {sharedPayer.map(x=>x.orderId).join(', ')} (separate receipts, not merged).</p>}
   <h4 className="text-[10px] font-bold uppercase tracking-[0.18em] text-[#8a8a8a] mb-1">Source receipts</h4>
   {r.rc.map(x=>{const p=dec(x.url);return <div key={x.id} className="border border-[#2a2a2a] p-3 mb-2 text-xs space-y-1"><div className="mono">{x.sourceReceiptId} · {money(x.amount,cur)}</div><div>Payload timestamp: {p&&p.ts?new Date(p.ts).toLocaleString():'n/a'}</div><Ext url={x.url} label="Open original receipt"/><div className="text-[#777]">Opening a receipt does not verify that payment cleared.</div></div>})}{!r.rc.length&&<p className="text-sm text-[#777] mb-2">No receipt record.</p>}
   <div className={'border p-3 text-sm mb-4 '+(r.is.length?'border-amber-800 text-amber-300':'border-emerald-900 text-emerald-400')}><b className="uppercase text-[10px] tracking-widest">Reconciliation</b>{r.is.length?<ul className="list-disc pl-5 mt-1">{r.is.map((i,k)=><li key={k}>{i}</li>)}</ul>:<div>Allocations, order total and receipt amount agree.</div>}</div>
   <div className="flex justify-between"><button className={btnD} onClick={()=>ask('Delete order','Delete order '+o.orderId+', its receipt records and '+r.l.length+' linked attendee(s)? '+(o.paymentStatus==='Paid'?'Total Revenue Made will fall by '+money(o.orderTotal,cur)+'.':''),'Delete order',()=>{upd(d=>({...d,orders:d.orders.filter(x=>x.id!==o.id),receipts:d.receipts.filter(x=>x.orderId!==o.orderId),attendees:d.attendees.filter(x=>x.orderId!==o.orderId)}));setSelOrder(null);note('Order deleted')})}><I n="trash"/>Delete order</button><div className="flex gap-2"><button className={btn} onClick={()=>setSelOrder(null)}>Close</button><button className={btnP} onClick={save}>Save order</button></div></div></Modal>};

 const Blacklist=()=>{const nq=norm(bq);const reasons=[...new Set(B.map(b=>b.rejectionReason))];const rows=B.filter(b=>(!nq||norm(b.fullName).includes(nq)||b.phone.includes(bq.trim())||norm(b.orderId).includes(nq))&&(!bR||b.rejectionReason===bR)&&(!bS||b.reviewStatus===bS));return <>
  <Pg t="BLACKLIST / REJECTED SUBMISSIONS" sub="Administrative rejections and reported receipt issues. Recorded notes are reports, not independently verified facts." right={<><button className={btn} onClick={()=>{dl('vovex-blacklist.csv',['Name','Phone number','Order ID','Ticket type','Rejection reason','Administrative status','Receipt URL','Internal notes','Review status'],B.map(b=>[b.fullName,b.phone,b.orderId,b.ticketType,b.rejectionReason,b.administrativeStatus,b.receiptUrl,b.notes,b.reviewStatus]));note('Blacklist exported')}}><I n="down"/>CSV</button><button className={btnP} onClick={()=>setModal({k:'bl'})}><I n="plus"/>Add record</button></>}/>
  <Panel title={'Possible matches with paid attendees ('+matches.length+')'} cls="mb-4">{matches.length?<ul className="space-y-2">{matches.map(m=>{const rv=data.reviewedMatches.includes(m.key);return <li key={m.key} className="flex flex-wrap items-center gap-2 text-sm"><Badge c={rv?'ok':'warn'}>{rv?'Reviewed':'REVIEW REQUIRED'}</Badge><span><b>{m.a.fullName}</b> (order <button className="mono text-xs underline" onClick={()=>openOrder(m.a)}>{m.a.orderId}</button>) ↔ <b>{m.b.fullName}</b> · matched on: {m.why}</span><button className={btn} onClick={()=>upd(d=>({...d,reviewedMatches:rv?d.reviewedMatches.filter(k=>k!==m.key):[...d.reviewedMatches,m.key]}))}>{rv?'Reopen':'Mark reviewed'}</button></li>})}</ul>:<span className="text-sm text-[#777]">No matches. Matches are prompts for review, not accusations; no ticket is changed automatically.</span>}</Panel>
  <div className="grid grid-cols-2 lg:grid-cols-4 gap-2 mb-3"><div className="col-span-2 relative"><span className="absolute left-2.5 top-2.5 text-[#666]"><I n="search"/></span><input aria-label="Search" className={inp+' pl-8'} placeholder="Search name, phone, order ID" value={bq} onChange={e=>setBq(e.target.value)}/></div><select aria-label="Reason" className={inp} value={bR} onChange={e=>setBR(e.target.value)}><option value="">All reasons</option>{reasons.map(r=><option key={r}>{r}</option>)}</select><select aria-label="Review status" className={inp} value={bS} onChange={e=>setBS(e.target.value)}><option value="">All statuses</option><option>Pending review</option><option>Reviewed</option></select></div>
  <div className="border border-[#2a2a2a] bg-[#101010] overflow-x-auto">{rows.length?<table className="w-full min-w-[1100px]"><thead><tr>{['Name','Phone','Order ID','Ticket','Recorded reason','Status','Receipt','Internal notes','Review','Actions'].map(h=><th key={h} className={th}>{h}</th>)}</tr></thead><tbody>{rows.map(b=>{const fl=blFlags(b);return <tr key={b.id} className="hover:bg-[#161616]"><td className={td+' font-semibold'}>{b.fullName}</td><td className={td+' mono'}>{b.phone||'—'}</td><td className={td+' mono text-xs'}>{b.orderId||'—'}</td><td className={td}>{b.ticketType||'—'}</td><td className={td+' text-xs max-w-[220px]'}>{b.rejectionReason}</td><td className={td}><Badge c="red">REJECTED BY ADMIN</Badge>{b.entryDenied&&<div className="mt-1"><Badge c="red">⛔ DENIED ENTRY</Badge></div>}</td><td className={td}><Ext url={b.receiptUrl}/></td><td className={td+' text-xs max-w-[220px]'}>{b.notes||'—'}{fl.map((x,i)=><div key={i} className="text-amber-400 mt-1">⚑ {x}</div>)}</td><td className={td}><Badge c={b.reviewStatus==='Reviewed'?'ok':'gray'}>{b.reviewStatus}</Badge></td><td className={td}><div className="flex gap-1"><button className={btn} onClick={()=>upd(d=>({...d,blacklist:d.blacklist.map(x=>x.id===b.id?{...x,reviewStatus:x.reviewStatus==='Reviewed'?'Pending review':'Reviewed'}:x)}))}>{b.reviewStatus==='Reviewed'?'Reopen':'Reviewed'}</button><button className={btn} onClick={()=>{upd(d=>({...d,blacklist:d.blacklist.map(x=>x.id===b.id?{...x,entryDenied:!x.entryDenied}:x)}));note(b.entryDenied?'Entry denial lifted':'Entry denied for '+b.fullName)}}>{b.entryDenied?'Lift denial':'Deny entry'}</button><button className={btn} aria-label={'Edit '+b.fullName} onClick={()=>setModal({k:'bl',b})}><I n="edit" s={13}/></button><button className={btnD} aria-label={'Delete '+b.fullName} onClick={()=>ask('Delete record','Delete rejected record for '+b.fullName+'?','Delete',()=>{upd(d=>({...d,blacklist:d.blacklist.filter(x=>x.id!==b.id)}));note('Record deleted')})}><I n="trash" s={13}/></button></div></td></tr>})}</tbody></table>:<Empty t="No records match"/>}</div></>};

 const Settings=()=>{const[s,setS]=useState({...st,categories:st.categories.map(c=>({...c})),credentials:getCreds(st).map(c=>({...c}))});const[nc,setNc]=useState({name:'',price:''});const[er,setEr]=useState({});
  const save=()=>{const x={};if(!s.eventName.trim())x.eventName='Required';if(s.credentials.some(c=>!c.username.trim()||!(c.pwInput||c.password)))x.creds='Every credential needs a username and password';else if(new Set(s.credentials.map(c=>c.username.trim().toLowerCase())).size!==s.credentials.length)x.creds='Usernames must be unique';if(!s.currency.trim())x.currency='Required';if(s.categories.some(c=>c.price===''||isNaN(+c.price)||+c.price<0))x.cats='Prices must be valid numbers';setEr(x);if(Object.keys(x).length)return note('Fix the highlighted fields',1);upd(d=>({...d,settings:{...s,credentials:s.credentials.map(c=>({username:c.username.trim(),password:c.pwInput||c.password})),demoPassword:(s.credentials[0].pwInput||s.credentials[0].password),categories:s.categories.map(c=>({...c,price:+c.price}))}}));note('Settings saved. Existing sales were not rewritten.')};
  return <><Pg t="Settings" sub="Changes to ticket prices apply to new tickets only; historical allocations are preserved."/>
  <div className="grid lg:grid-cols-2 gap-3"><Panel title="Event"><Field label="Event name" err={er.eventName}><input className={inp} value={s.eventName} onChange={e=>setS({...s,eventName:e.target.value})}/></Field><Field label="Event date"><input className={inp} value={s.eventDate} onChange={e=>setS({...s,eventDate:e.target.value})}/></Field><Field label="Currency" err={er.currency}><input className={inp} value={s.currency} onChange={e=>setS({...s,currency:e.target.value})}/></Field>
   <h4 className="text-[10px] font-bold uppercase tracking-[0.18em] text-[#8a8a8a] mb-2 mt-4">Login credentials</h4>{s.credentials.map((c,i)=><div key={i} className="flex gap-2 mb-2"><input aria-label="Username" className={inp} placeholder="Username" value={c.username} onChange={e=>setS({...s,credentials:s.credentials.map((x,j)=>j===i?{...x,username:e.target.value}:x)})}/><input aria-label="Password" type="password" autoComplete="new-password" className={inp} placeholder={c.password?'New password (blank = keep)':'Password'} value={c.pwInput||''} onChange={e=>setS({...s,credentials:s.credentials.map((x,j)=>j===i?{...x,pwInput:e.target.value}:x)})}/><button className={btnD} aria-label="Remove credential" disabled={s.credentials.length<2} onClick={()=>setS({...s,credentials:s.credentials.filter((_,j)=>j!==i)})}><I n="trash" s={13}/></button></div>)}{er.creds&&<div className="text-xs text-red-400 mb-2">{er.creds}</div>}<button className={btn} onClick={()=>setS({...s,credentials:[...s.credentials,{username:'',password:''}]})}><I n="plus" s={13}/>Add credential</button><p className="text-[11px] text-[#777] mt-2">Save settings to apply changes.</p></Panel>
   <Panel title="Ticket categories & prices">{s.categories.map((c,i)=><div key={c.name} className="flex gap-2 items-center mb-2"><input className={inp} disabled value={c.name}/><input aria-label={c.name+' price'} className={inp+' mono w-28'} type="number" min="0" value={c.price} onChange={e=>setS({...s,categories:s.categories.map((x,j)=>j===i?{...x,price:e.target.value}:x)})}/><button className={btnD} aria-label={'Remove '+c.name} onClick={()=>setS({...s,categories:s.categories.filter((_,j)=>j!==i)})}><I n="trash" s={13}/></button></div>)}{er.cats&&<div className="text-xs text-red-400">{er.cats}</div>}
    <div className="flex gap-2 mt-3"><input className={inp} placeholder="New category" value={nc.name} onChange={e=>setNc({...nc,name:e.target.value})}/><input className={inp+' mono w-28'} type="number" placeholder="Price" value={nc.price} onChange={e=>setNc({...nc,price:e.target.value})}/><button className={btn} onClick={()=>{if(!nc.name.trim()||nc.price===''||isNaN(+nc.price))return note('Enter a name and price',1);if(s.categories.some(c=>norm(c.name)===norm(nc.name)))return note('Category exists',1);setS({...s,categories:[...s.categories,{name:nc.name.trim(),price:+nc.price}]});setNc({name:'',price:''})}}><I n="plus" s={13}/></button></div></Panel></div>
  <div className="flex flex-wrap gap-2 mt-4"><button className={btnP} onClick={save}>Save settings</button>
   <button className={btn} onClick={()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({...data,settings:{...data.settings,credentials:undefined,demoPassword:undefined}},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='vovex-rocks-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);note('Data exported')}}><I n="down"/>Export all data (JSON)</button>
   <button className={btnD} onClick={()=>ask('Reset to original data','This replaces ALL saved changes, check-ins, settings and records with the original supplied dataset.','Reset everything',()=>{setData(seed());setSelOrder(null);note('Original dataset restored')})}>Reset to original data</button></div></>};

 const NAV=[['overview','Overview','grid'],['attendees','Attendees','users'],['orders','Orders & Receipts','rcpt'],['blacklist','Blacklist','ban'],['settings','Settings','cog']];
 const go=p=>{setPage(p);setNav(false);setSelOrder(null)};
 return <div className="min-h-screen lg:flex">
  <aside className={'fixed lg:sticky top-0 z-40 h-screen w-64 shrink-0 bg-[#0d0d0d] border-r border-[#2a2a2a] flex flex-col transition-transform '+(nav?'translate-x-0':'-translate-x-full lg:translate-x-0')}>
   <div className="p-5 border-b border-[#2a2a2a]"><div className="text-2xl font-black tracking-tighter leading-none">VOVEX<br/>ROCKS</div><div className="text-[9px] tracking-[0.3em] text-[#8a8a8a] font-bold mt-2">EVENT CONTROL CENTER</div></div>
   <nav className="flex-1 py-3" aria-label="Main">{NAV.map(([k,l,i])=><button key={k} onClick={()=>go(k)} aria-current={page===k?'page':undefined} className={'w-full flex items-center gap-3 px-5 py-3 text-xs font-bold uppercase tracking-[0.15em] border-l-[3px] '+(page===k?'border-[#e8e2d0] bg-[#1a1a1a] text-white':'border-transparent text-[#888] hover:text-white hover:bg-[#141414]')}><I n={i}/>{l}</button>)}</nav>
   <div className="p-5 border-t border-[#2a2a2a] text-[10px] uppercase tracking-widest text-[#888] space-y-3"><div className="flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-emerald-500"/>Data saved</div><button className={btn+' w-full justify-center'} onClick={()=>{try{sessionStorage.removeItem('vvx_auth')}catch(e){}setAuth(false)}}><I n="out"/>Logout</button></div></aside>
  {nav&&<div className="fixed inset-0 z-30 bg-black/60 lg:hidden" onClick={()=>setNav(false)}/>}
  <div className="flex-1 min-w-0"><header className="sticky top-0 z-20 bg-[#0a0a0a]/95 border-b border-[#2a2a2a] px-4 sm:px-8 py-3 flex items-center gap-3"><button className="lg:hidden p-1" aria-label="Open menu" onClick={()=>setNav(true)}><I n="menu" s={20}/></button><div className="min-w-0"><div className="text-[10px] font-bold tracking-[0.25em] text-[#8a8a8a]">VOVEX ROCKS · EVENT CONTROL CENTER</div><div className="text-sm truncate">{st.eventName} · {st.eventDate}</div></div><div className="ml-auto hidden sm:flex items-center gap-2 text-[10px] uppercase tracking-widest text-[#888]"><Badge c={warns.length?'warn':'ok'}>{warns.length?warns.length+' data warnings':'Data clean'}</Badge></div></header>
   <main className="p-4 sm:p-8">{page==='overview'&&Overview()}{page==='attendees'&&Attendees()}{page==='orders'&&Orders()}{page==='blacklist'&&Blacklist()}{page==='settings'&&<Settings key={JSON.stringify(st)}/>}
    </main></div>
  {selOrder&&<OrderDrawer key={selOrder}/>}
  {modal?.k==='att'&&<Modal title={modal.a?'Edit attendee':'Add attendee'} onClose={()=>setModal(null)}><AttForm init={modal.a} cats={cats} cur={cur} onClose={()=>setModal(null)} onSave={f=>modal.a?editAtt(modal.a.id,f):addAtt(f)}/></Modal>}
  {modal?.k==='bl'&&<Modal title={modal.b?'Edit record':'Add rejected record'} onClose={()=>setModal(null)}><BlForm init={modal.b} onClose={()=>setModal(null)} onSave={f=>{upd(d=>({...d,blacklist:modal.b?d.blacklist.map(x=>x.id===modal.b.id?{...x,...f}:x):[...d.blacklist,{...f,id:uid('bl')}]}));setModal(null);note('Record saved')}}/></Modal>}
  {conf&&<Modal title={conf.title} onClose={()=>setConf(null)}><p className="text-sm text-[#ccc] mb-4">{conf.body}</p><div className="flex justify-end gap-2"><button className={btn} onClick={()=>setConf(null)}>Cancel</button><button className={btnD} onClick={()=>{const f=conf.fn;setConf(null);f()}}>{conf.label}</button></div></Modal>}
  {toast&&<div role="status" className={'fixed bottom-5 right-5 z-[60] px-4 py-3 text-sm font-semibold border '+(toast.err?'bg-red-950 border-red-800 text-red-200':'bg-[#e8e2d0] text-black border-white')}>{toast.m}</div>}
 </div>}
class ErrBoundary extends React.Component{constructor(p){super(p);this.state={e:null}}static getDerivedStateFromError(e){return{e}}render(){return this.state.e?<main className="min-h-screen flex items-center justify-center p-6"><div className="max-w-md border border-red-900 p-6 bg-[#120808]"><h1 className="font-black uppercase">Something went wrong</h1><p className="text-sm text-[#bbb] my-3 mono break-words">{String(this.state.e&&this.state.e.message||this.state.e)}</p><button className={btn} onClick={()=>location.reload()}>Reload</button></div></main>:this.props.children}}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrBoundary><App/></ErrBoundary>);
</script></body></html>

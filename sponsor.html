<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOVEX ROCKS | Sponsor Portal</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0a'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='30' font-style='italic' font-weight='700' fill='%23c4b8a8' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--black:#0a0a0a;--char:#141414;--dg:#1a1a1a;--mg:#2a2a2a;--steel:#3d3d3d;--warm:#f5f0ea;--beige:#c4b8a8;--olive:#5a6a4a;--red:#6a1a1a;--muted:#b8aea4;--dim:#a09888;--line:rgba(255,255,255,.1);
--display:'Playfair Display',serif;--body:'Roboto',sans-serif;--alt:'Montserrat',sans-serif;--head:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--black);color:var(--warm);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--beige);outline-offset:2px}
.mono{font-family:var(--mono)}
.mark{font-family:var(--display);font-style:italic;font-weight:700;color:var(--beige);font-size:1.9rem;line-height:1;width:46px;height:46px;border:1px solid var(--beige);display:grid;place-items:center}
.btn{background:var(--beige);color:var(--black);border:0;padding:.85rem 1.4rem;font-family:var(--alt);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:opacity .2s,transform .2s}
.btn:hover:not(:disabled){opacity:.88}.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--warm);border:1px solid var(--steel)}
.btn.sec:hover:not(:disabled){border-color:var(--beige);opacity:1}
.btn.sm{padding:.45rem .7rem;font-size:.68rem}
label{display:block;font-family:var(--alt);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
input,select,textarea{width:100%;background:var(--black);border:1px solid var(--steel);padding:.75rem .85rem;border-radius:2px;font-size:1rem}
input:focus,select:focus,textarea:focus{border-color:var(--beige);outline:none}
input.bad,select.bad{border-color:#c0584a}
.err{color:#e08c80;font-size:.82rem;margin-top:.3rem;min-height:1.1em}
.f{margin-bottom:1.1rem}
.note{color:var(--dim);font-size:.82rem}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:1.2rem}
.lcard{width:100%;max-width:420px;background:var(--char);border:1px solid var(--line);border-top:3px solid var(--red);padding:2.2rem 1.8rem;animation:rise .6s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mark.logo{border:0;width:auto;height:64px;max-width:200px}
.mark.logo img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
.lcard .mark{margin:0 auto 1rem}
.lcard h1{font-family:var(--head);font-size:1.35rem;letter-spacing:.14em;text-align:center;margin:0}
.lcard .sub{font-family:var(--alt);text-align:center;color:var(--beige);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;margin:.4rem 0 1.8rem}
.pw{position:relative}.pw button{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--beige);font-size:.72rem;letter-spacing:.1em;padding:.5rem;cursor:pointer;font-family:var(--alt)}
.pw input{padding-right:4.6rem}
/* dash */
header.top{display:flex;align-items:center;gap:1rem;padding:1rem 1.4rem;border-bottom:1px solid var(--line);background:var(--char);flex-wrap:wrap}
header.top .mark{width:40px;height:40px;font-size:1.6rem}
header.top .mark.logo{width:auto;height:44px}
header.top h1{margin:0;font-family:var(--head);font-size:1.05rem;letter-spacing:.12em}
header.top small{display:block;color:var(--muted);font-family:var(--alt);font-size:.68rem;letter-spacing:.22em;text-transform:uppercase}
.sp{flex:1}
.auth{font-family:var(--alt);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#9fb08c;display:flex;align-items:center;gap:.45rem}
.auth::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--olive)}
main{max-width:1200px;margin:0 auto;padding:1.4rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
.stat{background:var(--char);border:1px solid var(--line);padding:1rem 1.1rem;min-width:0}
.stat .k{font-family:var(--alt);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--head);font-size:1.55rem;font-weight:700;margin-top:.25rem;overflow-wrap:anywhere}
.stat .v.m{font-family:var(--mono);font-size:1.15rem;padding:.3rem 0}
.stat .h{font-size:.72rem;color:var(--dim)}
.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:1.4rem;margin-top:1.4rem;align-items:start}
.card{background:var(--char);border:1px solid var(--line);padding:1.3rem}
.card h2{font-family:var(--head);font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 1rem;color:var(--beige)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.seg input{position:absolute;opacity:0;width:0}
.seg label{margin:0;border:1px solid var(--steel);padding:.7rem;text-align:center;cursor:pointer;letter-spacing:.1em;color:var(--warm)}
.seg label span{display:block;font-family:var(--mono);color:var(--muted);font-size:.74rem;letter-spacing:0;margin-top:.15rem}
.seg input:checked+label{border-color:var(--beige);background:var(--mg)}
.seg input:focus-visible+label{outline:2px solid var(--beige);outline-offset:2px}
.status{margin-top:1rem;padding:.8rem .9rem;border-left:3px solid var(--steel);background:var(--dg);font-size:.88rem}
.status.ok{border-color:var(--olive)}.status.bad{border-color:#c0584a}.status.warn{border-color:var(--beige)}
.status a{color:var(--beige)}
.spin{display:inline-block;width:.9em;height:.9em;border:2px solid var(--black);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-.12em;margin-right:.5rem}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{display:inline-block;font-family:var(--alt);font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.25rem .55rem;border:1px solid var(--steel);color:var(--muted)}
.chip.confirmed,.chip.submitted{color:#b7c9a4;border-color:var(--olive)}.chip.failed{color:#e08c80;border-color:#8a3a30}.chip.pending{color:var(--beige);border-color:var(--beige)}
.pvhead{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.pvhead h2{margin:0}
.stage{position:relative;width:100%;max-width:560px;margin:0 auto;overflow:hidden}
.stage .scaler{transform-origin:top left;width:560px}
.wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.wm span{transform:rotate(-24deg);font-family:var(--alt);font-weight:700;font-size:1.25rem;letter-spacing:.2em;color:rgba(106,26,26,.55);border:3px solid rgba(106,26,26,.55);padding:.4rem 1rem;background:rgba(245,240,234,.55);text-align:center}
.acts{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;justify-content:center}
.hist-tools{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.hist-tools input{flex:1;min-width:180px}.hist-tools select{width:auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{font-family:var(--alt);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.5rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.6rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
td.id{font-family:var(--mono);white-space:nowrap}
.hist{margin-top:1.4rem}
/* ticket (mirrors the site's receipt card: #f5f0ea, deep-red top rule) */
.tk{width:560px;height:860px;background:#f5f0ea;color:#0a0a0a;border-top:8px solid #6a1a1a;padding:34px 40px;display:flex;flex-direction:column;overflow:hidden;font-family:'Roboto',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tk .br{text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:25px;letter-spacing:.14em}
.tk .tt{text-align:center;font-family:'Montserrat',sans-serif;font-weight:500;font-size:14px;letter-spacing:.3em;color:#555;margin:6px 0 18px}
.tk .sb{background:#0a0a0a;color:#c4b8a8;text-align:center;font-family:'Montserrat',sans-serif;font-weight:700;font-size:21px;letter-spacing:.26em;padding:14px 0}
.tk .l{font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#777;margin-top:16px}
.tk .id{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;letter-spacing:.04em}
.tk .hn{font-size:24px;font-weight:700;line-height:1.2;max-height:58px;overflow:hidden;overflow-wrap:anywhere}
.tk .row{display:flex;gap:24px;align-items:flex-end}.tk .row>div{flex:1;min-width:0}
.tk .v{font-size:19px;font-weight:600}
.tk .bd{display:inline-block;font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;background:#0a0a0a;color:#f5f0ea;padding:5px 12px;margin-top:4px}
.tk .bd.r{background:#6a1a1a}
.tk .dv{border-top:2px dashed #d8d0c4;margin:22px 0 16px}
.tk .qr{text-align:center}.tk .qr canvas{width:210px;height:210px;image-rendering:pixelated}
.tk .qr small{display:block;color:#666;font-size:12px;margin-top:6px}
.tk .fp{margin-top:auto;text-align:center;font-size:11px;color:#777;line-height:1.45}
#printSheet,#exportHost{display:none}
#exportHost{display:block;position:fixed;left:-10000px;top:0}
@media(max-width:900px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr;gap:.6rem}.stat .v{font-size:1.25rem}main{padding:1rem .8rem}.acts .btn{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{@page{margin:12mm}body>*:not(#printSheet){display:none!important}#printSheet{display:flex!important;justify-content:center}body{background:#fff}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" aria-labelledby="lt">
 <form class="lcard" id="loginForm" novalidate>
  <div class="mark logo"><img src="https://www.vovex.rocks/logo.PNG" alt="VOVEX ROCKS" onerror="this.parentNode.classList.remove('logo');this.parentNode.textContent='V'"></div>
  <h1 id="lt">VOVEX ROCKS</h1>
  <div class="sub">Sponsor Portal<br>Authorized Complimentary Ticket Access</div>
  <div class="f"><label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
  <div class="f"><label for="p">Password</label><div class="pw"><input id="p" type="password" autocomplete="current-password"><button type="button" id="showpw" aria-pressed="false">SHOW</button></div></div>
  <div class="err" id="lerr" role="alert"></div>
  <button class="btn" style="width:100%;margin-top:.6rem">Log in</button>
 </form>
</section>

<!-- DASHBOARD -->
<div id="dash" hidden>
 <header class="top">
  <div class="mark logo"><img src="https://www.vovex.rocks/logo.PNG" alt="VOVEX ROCKS" onerror="this.parentNode.classList.remove('logo');this.parentNode.textContent='V'"></div>
  <div><h1>VOVEX ROCKS · Sponsor Portal</h1><small>Halloween Event</small></div>
  <div class="sp"></div>
  <div class="auth">Authorized sponsor · <span id="whoName"></span></div>
  <button class="btn sec sm" id="logout">Log out</button>
 </header>
 <main>
  <section class="stats" aria-label="Dashboard statistics">
   <div class="stat"><div class="k">Sponsor</div><div class="v" id="whoCard"></div><div class="h">Complimentary tickets</div></div>
  </section>

  <div class="grid">
   <section class="card" aria-labelledby="gt">
    <h2 id="gt">Complimentary Ticket</h2>
    <form id="tf" novalidate>
     <div class="f"><label for="fn">Ticket holder full name *</label><input id="fn" maxlength="60" autocomplete="off"><div class="err" id="e-fn"></div></div>
     <div class="f"><label id="ctl">Ticket category *</label>
      <div class="seg" role="radiogroup" aria-labelledby="ctl">
       <input type="radio" name="tt" id="t1" value="regular"><label for="t1">Regular Click here<span>800 ETB</span></label>
      </div><div class="err" id="e-tt"></div></div>
     <div class="f"><label for="fe">Email (optional)</label><input id="fe" type="email" maxlength="80"><div class="err" id="e-fe"></div></div>
     <div class="f"><label for="fp">Phone (optional)</label><input id="fp" type="tel" inputmode="tel" placeholder="09XXXXXXXX or +2519XXXXXXXX" maxlength="20"><div class="err" id="e-fp"></div></div>
     <div class="f"><label for="fo">Notes (optional)</label><textarea id="fo" rows="2" maxlength="200"></textarea></div>
     <button class="btn" id="go" style="width:100%">Generate Sponsored Ticket</button>
     <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    </form>
   </section>

   <section class="card" aria-labelledby="pt">
    <div class="pvhead"><h2 id="pt">Ticket Preview</h2><span class="chip" id="chip">Draft</span></div>
    <div class="stage" id="stage"><div class="scaler" id="scaler"></div><div class="wm" id="wm"><span id="wmt">DRAFT PREVIEW<br>NOT SUBMITTED</span></div></div>
    <div class="acts">
     <button class="btn" id="dl" disabled>Download Ticket (PNG)</button>
     <button class="btn sec" id="pr" disabled>Print Ticket</button>
     <button class="btn sec" id="nw" hidden>New ticket</button>
    </div>
    <p class="note" style="text-align:center">Download and print unlock only after the submission.</p>
   </section>
  </div>

  
 </main>
</div>
<div id="printSheet" aria-hidden="true"></div>
<div id="exportHost" aria-hidden="true"></div>

<script>
"use strict";
/* ====================================================================
   CONFIGURATION
   >>> Replace the placeholder below with YOUR Formspree endpoint, e.g.
   >>> "https://formspree.io/f/abcdwxyz"  (create the form at formspree.io)
   Until replaced, nothing is sent and no ticket is ever marked successful.
   ==================================================================== */
const FORMSPREE_ENDPOINT = "https://formspree.io/f/mwlvaadk";
const PLACEHOLDER = "https://formspree.io/f/YOUR_FORM_ID";

/* Frontend-only login: these values are visible to anyone who views the source.
   This is a convenience gate, NOT secure authentication. */
const USERS = {
  nebyu:   { pass: "4511", name: "Nebyu",   prefix: "NEB" },
  tinsael: { pass: "3124", name: "Tinsael", prefix: "TIN" }
};
let LOGIN_USER = "", SPONSOR = "", PREFIX = "";

const TYPES = { early: { label: "Early Bird", value: 650 }, regular: { label: "Regular", value: 800 } }; // from the VOVEX ticket page
let K_OK = "", K_BAD = "";
const TIMEOUT_MS = 15000;
const $ = id => document.getElementById(id);

/* ---------- storage (defensive) ---------- */
function load(key) {
  try { const a = JSON.parse(localStorage.getItem(key) || "[]"); return Array.isArray(a) ? a.filter(r => r && typeof r.id === "string" && new RegExp("^" + PREFIX + "-HW-\\d{4,}$").test(r.id) && TYPES[r.type]) : []; }
  catch (e) { return []; }
}
function save(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); return true; } catch (e) { return false; } }
let okList = [], badList = [];

/* ---------- state ---------- */
let attempt = null;     // {id, generatedAt, uncertain} reused across retries of the same ticket
let shown = null;       // confirmed record currently displayed
let busy = false;

function nextId() {
  let max = 0;
  okList.concat(badList).forEach(r => { max = Math.max(max, parseInt(r.id.slice(7), 10) || 0); });
  return PREFIX + "-HW-" + String(max + 1).padStart(4, "0");
}
const fmtETB = n => n.toLocaleString("en-US") + " ETB";
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }); };

/* ---------- ticket rendering (text only, never innerHTML) ---------- */
function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function buildTicket(t) {
  const tk = mk("div", "tk");
  tk.append(mk("div", "br", "VOVEX ROCKS HALLOWEEN"), mk("div", "tt", "COMPLIMENTARY TICKET"), mk("div", "sb", SPONSOR.toUpperCase() + " SPONSORED"));
  tk.append(mk("div", "l", "Ticket ID"), mk("div", "id", t.id));
  tk.append(mk("div", "l", "Ticket holder"));
  const hn = mk("div", "hn", t.holder || "—"); hn.style.fontSize = (t.holder || "").length > 28 ? "19px" : "24px"; tk.append(hn);
  const row = mk("div", "row"), a = mk("div"), b = mk("div"), c = mk("div");
  a.append(mk("div", "l", "Category"), mk("span", "bd" + (t.type === "regular" ? " r" : ""), TYPES[t.type] ? TYPES[t.type].label : "—"));
  b.append(mk("div", "l", "Sponsor"), mk("div", "v", SPONSOR));
  c.append(mk("div", "l", "Issued"), mk("div", "v", fmtDate(t.generatedAt)));
  row.append(a, b, c); tk.append(row);
  tk.append(mk("div", "dv"));
  const qr = mk("div", "qr"), cv = document.createElement("canvas"); cv.width = cv.height = 420;
  try {
    const q = qrcode(0, "M"); q.addData(["VOVEX-ROCKS-HALLOWEEN", t.id, TYPES[t.type].label, t.holder].join("|")); q.make();
    const n = q.getModuleCount(), cell = 420 / (n + 8), x = cv.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, 420, 420); x.fillStyle = "#000";
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect(Math.floor((k + 4) * cell), Math.floor((r + 4) * cell), Math.ceil(cell), Math.ceil(cell));
  } catch (e) { /* holder text too long for QR: leave blank */ }
  qr.append(cv, mk("small", null, "Show this ticket to event staff"));
  tk.append(qr);
  tk.append(mk("div", "fp", "Complimentary ticket sponsored by " + SPONSOR + ". This is not a payment receipt."));
  return tk;
}

/* ---------- preview ---------- */
function readForm() {
  const tt = document.querySelector('input[name="tt"]:checked');
  return { holder: $("fn").value.replace(/\s+/g, " ").trim(), type: tt ? tt.value : "early", email: $("fe").value.trim(), phone: $("fp").value.replace(/[\s\-()]/g, ""), notes: $("fo").value.trim() };
}
function fitStage() {
  const w = $("stage").clientWidth, s = Math.min(1, w / 560);
  $("scaler").style.transform = "scale(" + s + ")"; $("stage").style.height = (860 * s) + "px";
}
function setChip(kind, text) { const c = $("chip"); c.className = "chip " + kind; c.textContent = text; }
function renderPreview() {
  const sc = $("scaler"); sc.textContent = "";
  if (shown) {
    sc.append(buildTicket(shown)); $("wm").hidden = true; setChip("confirmed", "Submitted");
  } else {
    const f = readForm();
    sc.append(buildTicket({ id: attempt ? attempt.id : nextId(), holder: f.holder, type: f.type, generatedAt: attempt ? attempt.generatedAt : new Date().toISOString() }));
    $("wm").hidden = false;
    if (busy) { setChip("pending", "Pending"); $("wmt").innerHTML = "PENDING<br>NOT CONFIRMED"; }
    else if (attempt) { setChip("failed", "Not submitted"); $("wmt").innerHTML = "NOT SUBMITTED<br>RETRY AVAILABLE"; }
    else { setChip("", "Draft"); $("wmt").innerHTML = "DRAFT PREVIEW<br>NOT SUBMITTED"; }
  }
  $("dl").disabled = $("pr").disabled = !shown; $("nw").hidden = !shown;
  fitStage();
}

/* ---------- status / stats / history ---------- */
function say(kind, html) {
  const s = $("status"); s.hidden = !html; s.className = "status " + kind; s.textContent = "";
  if (html) { (Array.isArray(html) ? html : [html]).forEach(n => s.append(typeof n === "string" ? document.createTextNode(n) : n)); }
}

/* ---------- validation ---------- */
function validate() {
  const f = readForm(), e = {};
  if (f.holder.split(" ").filter(Boolean).length < 2 || f.holder.length < 3) e.fn = "Enter the holder's first and last name.";
  if (!document.querySelector('input[name="tt"]:checked')) e.tt = "Choose a ticket category.";
  if (f.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email)) e.fe = "That email address doesn't look right.";
  if (f.phone && !/^(\+251|251|0)[79]\d{8}$/.test(f.phone)) e.fp = "Enter a valid Ethiopian number, e.g. 0912345678 or +251912345678.";
  ["fn", "tt", "fe", "fp"].forEach(k => { $("e-" + k).textContent = e[k] || ""; const i = $(k); if (i) i.classList.toggle("bad", !!e[k]); });
  return { f, ok: !Object.keys(e).length };
}

/* ---------- Formspree ---------- */
const endpointOk = () => FORMSPREE_ENDPOINT !== PLACEHOLDER && /^https:\/\/formspree\.io\/[A-Za-z0-9_\/-]+$/.test(FORMSPREE_ENDPOINT);
async function submitToFormspree(payload) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(FORMSPREE_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(payload), signal: ctl.signal });
    let j = null; try { j = await res.json(); } catch (_) { }
    if (res.ok && !(j && j.ok === false)) return { ok: true };
    let msg = "Formspree rejected the submission (HTTP " + res.status + ").";
    if (res.status === 429) msg = "Too many submissions in a short time. Wait a minute, then retry.";
    else if (res.status === 404) msg = "The Formspree endpoint was not found. Check FORMSPREE_ENDPOINT.";
    else if (j && Array.isArray(j.errors) && j.errors.length) msg = j.errors.map(x => x.message).join(" ");
    return { ok: false, definite: true, msg };
  } catch (err) {
    return { ok: false, definite: false, msg: err.name === "AbortError" ? "The request timed out." : "Network error: the request could not be completed." };
  } finally { clearTimeout(timer); }
}
function formspreeLink() { const a = mk("a", null, "Formspree submissions"); a.href = "https://formspree.io/forms"; a.target = "_blank"; a.rel = "noopener"; return a; }

async function onGenerate(ev) {
  ev.preventDefault();
  if (busy) return;
  const v = validate(); if (!v.ok) { const b = document.querySelector(".bad"); if (b) b.focus(); return; }
  if (!endpointOk()) { say("warn", "No ticket was created."); return; }
  if (!attempt) attempt = { id: nextId(), generatedAt: new Date().toISOString(), uncertain: false };
  shown = null; busy = true; $("go").disabled = true; $("go").textContent = ""; $("go").append(mk("span", "spin"), "Submitting…");
  ["fn", "fe", "fp", "fo"].forEach(i => $(i).readOnly = true);
  say("warn", "Submitting ticket… waiting for confirmation."); renderPreview();
  const f = v.f, T = TYPES[f.type], payload = {
    _subject: SPONSOR + " Sponsored Halloween Ticket — " + attempt.id,
    sponsor_name: SPONSOR, sponsor_username: SPONSOR, event_name: "Halloween event", ticket_id: attempt.id, ticket_type: T.label,
    ticket_holder_name: f.holder, ticket_holder_email: f.email || "(not provided)", ticket_holder_phone: f.phone || "(not provided)",
    ticket_value: fmtETB(T.value), ticket_status: "complimentary", sponsorship_status: SPONSOR + " sponsored",
    generated_at: attempt.generatedAt, submission_source: SPONSOR + " Sponsor Portal", logged_in_user: LOGIN_USER
  };
  if (f.notes) payload.notes = f.notes;
  const r = await submitToFormspree(payload);
  busy = false; $("go").disabled = false; $("go").textContent = "Generate Sponsored Ticket";
  ["fn", "fe", "fp", "fo"].forEach(i => $(i).readOnly = false);
  if (r.ok) {
    const rec = { id: attempt.id, holder: f.holder, type: f.type, generatedAt: attempt.generatedAt };
    okList.push(rec); badList = badList.filter(x => x.id !== rec.id);
    const saved = save(K_OK, okList); save(K_BAD, badList);
    shown = rec; attempt = null; $("tf").reset();
    say("ok", "Ticket " + rec.id + " Ticket Generated successfully!" + (saved ? "" : " Local history could not be saved in this browser.") + "Download or print it below.");
  } else {
    if (!r.definite) attempt.uncertain = true;
    if (!badList.some(x => x.id === attempt.id)) badList.push({ id: attempt.id, holder: f.holder, type: f.type, generatedAt: attempt.generatedAt });
    save(K_BAD, badList);
    const parts = [r.msg + " Nothing was recorded as successful. Your entries are kept: press Generate again to retry with the same ticket ID (" + attempt.id + ")."];
    if (!r.definite) parts.push(" A network failure can happen after Formspree already received the request, so check your ", formspreeLink(), " for " + attempt.id + " before retrying to avoid a duplicate.");
    say("bad", parts);
  }
  renderPreview();
}

/* ---------- download / print ---------- */
async function download() {
  if (!shown) return;
  if (typeof html2canvas !== "function") { say("bad", "PNG export library failed to load (check your connection) and try again."); return; }
  const host = $("exportHost"); host.textContent = ""; const el = buildTicket(shown); host.append(el);
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const cv = await html2canvas(el, { scale: 3, backgroundColor: "#f5f0ea", useCORS: true, logging: false });
    const blob = await new Promise(res => cv.toBlob(res, "image/png"));
    if (!blob) throw new Error("empty");
    const a = mk("a"); a.href = URL.createObjectURL(blob); a.download = shown.id + ".png"; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  } catch (e) { say("bad", "Couldn't export the PNG. Try again, or use Print and choose 'Save as PDF'."); }
  finally { host.textContent = ""; }
}
function printTicket() {
  if (!shown) return;
  const ps = $("printSheet"); ps.textContent = ""; ps.append(buildTicket(shown));
  const done = () => { ps.textContent = ""; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done); window.print();
}

/* ---------- login / logout ---------- */
function login(ev) {
  ev.preventDefault();
  const u = $("u").value.trim().toLowerCase(), p = $("p").value;
  const acct = Object.prototype.hasOwnProperty.call(USERS, u) ? USERS[u] : null;
  if (acct && p === acct.pass) {
    LOGIN_USER = u; SPONSOR = acct.name; PREFIX = acct.prefix;
    K_OK = "vvx_" + u + "_tickets_v1"; K_BAD = "vvx_" + u + "_failed_v1";
    okList = load(K_OK); badList = load(K_BAD); attempt = null; shown = null;
    $("whoName").textContent = SPONSOR; $("whoCard").textContent = SPONSOR;
    $("lerr").textContent = ""; $("p").value = ""; $("login").hidden = true; $("dash").hidden = false;
    renderPreview(); $("fn").focus();
  } else { $("lerr").textContent = "Incorrect username or password."; $("p").select(); }
}
function logout() {
  $("tf").reset(); attempt = null; shown = null; busy = false; say("", "");
  document.querySelectorAll(".bad").forEach(x => x.classList.remove("bad")); document.querySelectorAll(".err").forEach(x => { if (x.id !== "lerr") x.textContent = ""; });
  $("dash").hidden = true; $("login").hidden = false; $("u").value = ""; $("u").focus();
}

/* ---------- wire up (each listener bound once) ---------- */
$("loginForm").addEventListener("submit", login);
$("showpw").addEventListener("click", e => { const p = $("p"), s = p.type === "password"; p.type = s ? "text" : "password"; e.target.textContent = s ? "HIDE" : "SHOW"; e.target.setAttribute("aria-pressed", s); });
$("logout").addEventListener("click", logout);
$("tf").addEventListener("submit", onGenerate);
$("tf").addEventListener("input", () => { if (busy) return; if (shown) { shown = null; say("", ""); } renderPreview(); });
$("dl").addEventListener("click", download);
$("pr").addEventListener("click", printTicket);
$("nw").addEventListener("click", () => { shown = null; attempt = null; $("tf").reset(); say("", ""); renderPreview(); $("fn").focus(); });
window.addEventListener("resize", fitStage);
</script>
